<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lifecycle Profiler banner</title>
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1544px; height: 500px; }
	body {
		background: #10233f;
		color: #ffffff;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		overflow: hidden;
		position: relative;
	}
	.bars { position: absolute; right: 90px; top: 70px; width: 640px; }
	.bar { height: 34px; border-radius: 6px; margin-bottom: 18px; }
	.text { position: absolute; left: 100px; top: 150px; width: 700px; }
	h1 { font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
	p { font-size: 38px; margin-top: 28px; color: #b8c7dd; line-height: 1.25; }
</style>
</head>
<body>
	<div class="bars">
		<div class="bar" style="width: 18%; margin-left: 0; background: #5aa9e6;"></div>
		<div class="bar" style="width: 30%; margin-left: 12%; background: #7fc8a9;"></div>
		<div class="bar" style="width: 22%; margin-left: 38%; background: #f2c14e;"></div>
		<div class="bar" style="width: 46%; margin-left: 52%; background: #f78154;"></div>
		<div class="bar" style="width: 26%; margin-left: 60%; background: #b388eb;"></div>
		<div class="bar" style="width: 14%; margin-left: 84%; background: #5aa9e6;"></div>
	</div>
	<div class="text">
		<h1>Lifecycle Profiler</h1>
		<p>Time every plugin, hook, template and block in a request.</p>
	</div>
</body>
</html>
