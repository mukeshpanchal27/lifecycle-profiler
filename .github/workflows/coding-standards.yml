name: Coding standards

on:
  push:
    branches:
      - trunk
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: composer, cs2pr

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHPCS
        run: composer lint -- --report-full --report-checkstyle=./phpcs-report.xml

      - name: Show PHPCS results in pull request
        if: ${{ always() && hashFiles('phpcs-report.xml') != '' }}
        run: cs2pr ./phpcs-report.xml
