name: Deploy to wordpress.org

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag, the plugin header, the version constant and the readme must agree.
      - name: Check the version numbers
        run: |
          version="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version: *//p' lifecycle-profiler.php)"
          constant="$(sed -n "s/^define( 'LIFECYCLE_PROFILER_VERSION', '\(.*\)' );/\1/p" lifecycle-profiler.php)"
          stable="$(sed -n 's/^Stable tag: *//p' readme.txt)"
          echo "Tag $version, header $header, constant $constant, stable tag $stable"
          if [[ "$version" != "$header" || "$version" != "$constant" || "$version" != "$stable" ]]; then
            echo "::error::The version numbers do not match the tag."
            exit 1
          fi

      - name: Check the release files
        run: bin/build-zip.sh build

      - name: Deploy to the wordpress.org SVN repository
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: lifecycle-profiler

      - name: Add the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See the changelog in readme.txt."
          gh release upload "$GITHUB_REF_NAME" "${{ steps.deploy.outputs.zip-path }}" --clobber
