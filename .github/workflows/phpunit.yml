name: PHPUnit

on:
  push:
    branches:
      - trunk
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: ${{ matrix.multisite && 'PHPUnit multisite' || 'PHPUnit' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        multisite: [ false, true ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Install npm packages
        run: npm ci

      - name: Start wp-env
        run: npm exec --no -- wp-env start

      - name: Run PHPUnit
        run: npm run ${{ matrix.multisite && 'test:php:multisite' || 'test:php' }}
