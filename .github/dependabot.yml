# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait until a release is two weeks old.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    groups:
      composer:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait until a release is two weeks old.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns:
          - '*'
