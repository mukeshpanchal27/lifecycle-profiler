name: Bug
description: Something does not work as expected.
labels: [ "bug" ]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a profiling session.
        2. Open the home page.
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, WordPress and PHP versions.
      placeholder: Plugin 0.1.0, WordPress 7.1, PHP 8.3
    validations:
      required: true
