name: Enhancement
description: Suggest a new feature or an improvement.
labels: [ "enhancement" ]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What to build, and why.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: A short checklist that shows the work is finished.
      value: |
        - [ ] 
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be finished first, such as #12.
